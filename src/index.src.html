<script>
const API_URL = "https://script.google.com/macros/s/AKfycbywcq_qWkVFbVROjwxUJ6AkzUsrqMtMGjmxZDuDDDbLbJztrSKkydGafLHJjLR9XIA/exec";
const REFRESH_MS = 60000;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const norm = (s) => String(s ?? '').trim().toLowerCase();
const fmtHours = (n) => (+n || 0).toLocaleString('uk-UA', { maximumFractionDigits: 2 });
const safeUrl = (u) => (/^https?:\/\//i.test(u) ? u : '');
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

const MESSAGES = {
  network: 'Немає зв’язку з API. Перевірте інтернет, API_URL і що доступ до вебдодатку: «Усі» (Anyone).',
  html: 'API повернув сторінку замість даних (ймовірно, вхід у Google). Перевірте, що доступ до вебдодатку: «Усі» (Anyone) і що API_URL закінчується на /exec.',
  bad_response: 'API повернув незрозумілу відповідь.',
  unauthorized: 'Невірний ключ доступу.',
  conflict: 'Рядок у таблиці змінився, дошку оновлено. Спробуйте ще раз.',
  tab_not_found: 'Вкладку не знайдено. Натисніть «Оновити».',
  title_required: 'Назва задачі обов’язкова.',
  bad_hours: 'Години мають бути числом, напр. 4,5.',
  bad_date: 'Неправильна дата.',
  no_tabs: 'Не знайдено жодної вкладки з колонкою «Задача».',
  old_script: 'Сторінка новіша за скрипт: вставте свіжий Code.gs в Apps Script і оновіть розгортання (Керування розгортаннями → ✏️ → Нова версія).',
  no_api_url: 'Не вказано API_URL у src/index.src.html.',
};
class ApiError extends Error {
  constructor(code, detail) { super(MESSAGES[code] || `Помилка: ${code}${detail ? ` (${detail})` : ''}`); this.code = code; }
}

let key = '';
const state = { order: store.get('kanbanOrder') === 'asc' ? 'asc' : 'desc', tabs: [], tab: '', data: null, lists: {}, project: '', pending: 0, dragging: false, lastDrag: 0, loadSeq: 0, stats: null, statsStale: false };

async function api(query, body) {
  if (API_URL.includes('PASTE_')) throw new ApiError('no_api_url');
  let text;
  try {
    const res = body
      ? await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, key }) })
      : await fetch(`${API_URL}?${new URLSearchParams({ ...query, key })}`);
    text = await res.text();
  } catch {
    throw new ApiError('network');
  }
  let data;
  try { data = JSON.parse(text); } catch { throw new ApiError(text.trimStart().startsWith('<') ? 'html' : 'bad_response'); }
  if (data.error) {
    if (data.error === 'unauthorized') logout(MESSAGES.unauthorized);
    throw new ApiError(data.error, data.message);
  }
  return data;
}

let toastTimer;
function toast(msg) {
  $('#toast').textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').textContent = ''; }, 6000);
}

// ---------- ключ ----------
function logout(msg) {
  key = '';
  store.set('kanbanKey', null);
  store.set('kanbanBoot', null);
  store.set('kanbanStats', null);
  Object.assign(state, { data: null, lists: {}, stats: null });
  projectColors = null;
  $('#app').hidden = true;
  $('#keyScreen').hidden = false;
  $('#keyError').textContent = msg || '';
  $('#keyInput').focus();
}

$('#logoutBtn').addEventListener('click', () => logout());

$('#keyForm').addEventListener('submit', (e) => {
  e.preventDefault();
  key = $('#keyInput').value.trim();
  store.set('kanbanKey', key);
  start();
});

// ---------- завантаження ----------
function boardMessage(msg) {
  $('#board').innerHTML = `<p class="w-full py-16 text-center text-sm text-neutral-500 dark:text-neutral-400">${esc(msg)}</p>`;
}

// Кеш у браузері: сторінка одразу показує дані з минулого разу, а свіжі підтягує у фоні.
const cacheGet = (k) => { try { const c = JSON.parse(store.get(k)); return c && c.api === API_URL ? c.data : null; } catch { return null; } };
const cacheSet = (k, data) => store.set(k, JSON.stringify({ api: API_URL, data }));

function showList(data) {
  state.data = data;
  state.lists[data.tab] = data;
  cacheSet('kanbanBoot', { ...data, tabs: state.tabs });
  render();
}

function showTabs(tabs, tab) {
  state.tabs = tabs;
  state.tab = tab;
  $('#tabSelect').innerHTML = tabs.map((t) => `<option>${esc(t.name)}</option>`).join('');
  $('#tabSelect').value = tab;
}

async function start({ fresh = false } = {}) {
  $('#keyScreen').hidden = true;
  $('#app').hidden = false;
  if (fresh) state.statsStale = true;
  const boot = cacheGet('kanbanBoot');
  if (!state.data && boot?.tabs) {
    showTabs(boot.tabs, boot.tab);
    showList(boot);
  } else if (!state.data) boardMessage('Завантаження…');
  setView(state.view || store.get('kanbanView'));
  const seq = ++state.loadSeq, btn = $('#refreshBtn');
  btn.disabled = true;
  try {
    const data = await api({ action: 'list', tab: state.tab, withTabs: 1, ...(fresh && { fresh: 1 }) });
    if (seq !== state.loadSeq) return;
    if (!data.tabs) return boardMessage(MESSAGES.old_script);
    showTabs(data.tabs, data.tab);
    showList(data);
    if (!state.stats) setTimeout(() => loadStats({ background: true }), 300); // статистика — заздалегідь
  } catch (e) {
    if (seq !== state.loadSeq || e.code === 'unauthorized') return;
    if (e.code === 'tab_not_found' && !state.tab) e.message = MESSAGES.old_script;
    if (state.data) toast(e.message); else boardMessage(e.message);
  } finally {
    if (seq === state.loadSeq) btn.disabled = false;
  }
}

async function loadList({ silent = false, fresh = false } = {}) {
  const seq = ++state.loadSeq, tab = state.tab, known = state.lists[tab];
  const btn = $('#refreshBtn');
  btn.disabled = true;
  if (!silent) {
    if (known) { state.data = known; render(); } else { state.data = null; boardMessage('Завантаження…'); }
  }
  try {
    const data = await api({ action: 'list', tab, ...(fresh && { fresh: 1 }) });
    if (seq !== state.loadSeq) return;
    showList(data);
  } catch (e) {
    if (seq !== state.loadSeq || e.code === 'unauthorized') return;
    if (state.data) toast(e.message); else boardMessage(e.message);
  } finally {
    if (seq === state.loadSeq) btn.disabled = false;
  }
}

$('#tabSelect').addEventListener('change', (e) => { state.tab = e.target.value; state.project = ''; loadList(); });
$('#projectFilter').addEventListener('change', (e) => { state.project = e.target.value; render(); });
$('#refreshBtn').addEventListener('click', () => (state.view === 'stats' ? loadStats({ fresh: true }) : start({ fresh: true })));

setInterval(() => {
  if (document.visibilityState === 'visible' && key && state.view === 'board' && state.data && !state.pending && !state.dragging &&
      !$('#editDialog').open && !document.querySelector('[data-add-form]')) loadList({ silent: true });
}, REFRESH_MS);

// ---------- рендер ----------
const DOT = {
  'not started': 'border border-neutral-400 dark:border-neutral-500',
  'in progress': 'bg-neutral-400 dark:bg-neutral-500',
  done: 'bg-neutral-950 dark:bg-white',
};
// Іконки: SF Symbols зі шрифту SF Pro Rounded, якщо він встановлений на пристрої (вбудовувати його ліцензія Apple не дозволяє).
// Інакше — Fluent UI System Icons (Microsoft, MIT).
const HAS_SF = (() => {
  try {
    const c = document.createElement('canvas').getContext('2d');
    c.font = '20px "SF Pro Rounded", monospace';
    const w = (cp) => c.measureText(String.fromCodePoint(cp)).width;
    return w(0x100185) !== w(0x10fffd); // галочка vs неіснуючий символ
  } catch { return false; }
})();
document.documentElement.classList.toggle('has-sf', HAS_SF);
const fluent = (size, d, cls) => `<svg viewBox="0 0 ${size} ${size}" fill="currentColor" class="${cls}" aria-hidden="true"><path d="${d}"/></svg>`;
const icon = (cp, svg, cls) => (HAS_SF ? `<span class="sf ${cls}" aria-hidden="true">${String.fromCodePoint(cp)}</span>` : svg);
const ICON_BRIEF = icon(0x10023f, fluent(20, 'M6.5 10a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1zm0 2a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1zm0 2a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1zM4 4c0-1.1.9-2 2-2h4.59q.62.01 1.06.44l3.91 3.91c.28.28.44.67.44 1.06V16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V8h-3.5A1.5 1.5 0 0 1 10 6.5V3zm5.5 4h3.3L11 3.2v3.3c0 .28.22.5.5.5', 'size-4'), 'text-[15px]');
const ICON_FILE = icon(0x100262, fluent(20, 'm4.83 10.48 5.65-5.65a3 3 0 0 1 4.25 4.24L8 15.8a1.5 1.5 0 0 1-2.12-2.12l6-6.01a.5.5 0 1 0-.7-.71l-6 6.01a2.5 2.5 0 0 0 3.53 3.54l6.71-6.72a4 4 0 1 0-5.65-5.66L4.12 9.78a.5.5 0 0 0 .7.7', 'size-4'), 'text-[15px]');
const ICON_CHECK = icon(0x100185, fluent(12, 'M9.85 3.15c.2.2.2.5 0 .7l-4.5 4.5a.5.5 0 0 1-.7 0l-2-2a.5.5 0 1 1 .7-.7L5 7.29l4.15-4.14c.2-.2.5-.2.7 0', 'size-3.5'), 'text-[11px]');
const ICON_REFRESH = icon(0x100148, fluent(20, 'M4 10a6 6 0 0 1 10.47-4H12.5a.5.5 0 0 0 0 1h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-1 0v1.6a7 7 0 1 0 1.98 4.36.5.5 0 1 0-1 .08L16 10a6 6 0 0 1-12 0', 'size-4'), 'text-[15px]');
$('#refreshIcon').innerHTML = ICON_REFRESH;
$('#orderIcon').innerHTML = icon(0x10012c, fluent(20, 'M2.35 7.35 5 4.71V16.5a.5.5 0 0 0 1 0V4.7l2.65 2.65a.5.5 0 0 0 .7-.7l-3.49-3.5A.5.5 0 0 0 5.5 3a.5.5 0 0 0-.39.18L1.65 6.65a.5.5 0 1 0 .7.7m15.3 5.3L15 15.29V3.5a.5.5 0 0 0-1 0v11.8l-2.65-2.65a.5.5 0 0 0-.7.7l3.49 3.5a.5.5 0 0 0 .36.15.5.5 0 0 0 .39-.18l3.46-3.47a.5.5 0 1 0-.7-.7', 'size-4'), 'text-[14px]');
function showOrder() {
  const label = state.order === 'desc' ? 'Нові зверху' : 'Старі зверху';
  $('#orderLabel').textContent = label;
  $('#orderBtn').title = `${label}. Натисніть, щоб змінити`;
  $('#orderBtn').setAttribute('aria-label', $('#orderBtn').title);
}
showOrder();
$('#orderBtn').addEventListener('click', () => {
  state.order = state.order === 'desc' ? 'asc' : 'desc';
  store.set('kanbanOrder', state.order);
  showOrder();
  render();
});

function columnsOf(data) {
  const cols = data.statuses.slice();
  for (const it of data.items) {
    if (!cols.some((s) => norm(s) === norm(it.status))) cols.push(it.status.trim());
  }
  return cols;
}
const columnFor = (cols, status) => cols.find((s) => norm(s) === norm(status)) ?? status;

function render() {
  const data = state.data;
  if (!data) return;
  const projects = [...new Set(data.items.map((i) => i.project).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'uk'));
  if (state.project && !projects.includes(state.project)) state.project = '';
  $('#projectFilter').innerHTML = `<option value="">Усі проєкти</option>` + projects.map((p) => `<option>${esc(p)}</option>`).join('');
  $('#projectFilter').value = state.project;
  $('#projectList').innerHTML = projects.map((p) => `<option value="${esc(p)}">`).join('');
  $('#assigneeList').innerHTML = [...new Set(data.items.map((i) => i.assignee).filter(Boolean))].map((p) => `<option value="${esc(p)}">`).join('');

  const visible = data.items.filter((i) => !state.project || i.project === state.project);
  $('#total').textContent = `${fmtHours(visible.reduce((s, i) => s + (i.hours || 0), 0))} год`;
  const cols = columnsOf(data);
  const ordered = state.order === 'desc' ? visible.slice().reverse() : visible; // desc — останні рядки таблиці зверху
  const itemsOf = (status) => ordered.filter((i) => columnFor(cols, i.status) === status);
  // Основні статуси — завжди; додаткові (Hold, Approved…) — лише коли в них є задачі. Те саме — у списку статусів на картці.
  const shown = cols.filter((s) => DOT[norm(s)] || itemsOf(s).length);
  $('#board').innerHTML = shown.map((status) => columnHtml(status, shown, itemsOf(status))).join('');

  if (!window.Sortable) return toast('Перетягування не працює. Змініть статус у списку на картці.');
  document.querySelectorAll('[data-list]').forEach((el) => Sortable.create(el, {
    group: 'board', animation: 150, forceFallback: true, fallbackTolerance: 4,
    delay: 250, delayOnTouchOnly: true, filter: 'select, a, [data-temp]', preventOnFilter: false,
    easing: 'cubic-bezier(0.4, 0, 0.2, 1)', ghostClass: 'drag-ghost', fallbackClass: 'drag-clone',
    onStart: () => { state.dragging = true; document.body.classList.add('cursor-grabbing', 'select-none'); },
    onMove: (e) => { dropTarget(e.to); },
    onEnd: (e) => {
      state.dragging = false;
      dropTarget(null);
      document.body.classList.remove('cursor-grabbing', 'select-none');
      state.lastDrag = Date.now();
      const item = findItem(e.item.dataset.row);
      if (!item) return;
      if (e.from !== e.to) return save(item, { status: e.to.dataset.list });
      if (e.oldIndex === e.newIndex) return;
      const sibling = (dir) => { let el = e.item; while ((el = el[dir]) && !el.matches('[data-row]')); return el && findItem(el.dataset.row); };
      // Сусід знизу на екрані — наступний рядок таблиці (або попередній, коли нові зверху).
      const below = sibling('nextElementSibling'), above = below ? null : sibling('previousElementSibling');
      if (state.order === 'desc') move(item, above, below);
      else move(item, below, above);
    },
  }));
}

// Підсвічує колонку, над якою зараз картка.
function dropTarget(list) {
  document.querySelectorAll('.drop-target').forEach((el) => { if (el !== list) el.classList.remove('drop-target'); });
  list?.classList.add('drop-target');
}

function columnHtml(status, cols, items) {
  const hours = items.reduce((s, i) => s + (i.hours || 0), 0);
  const dot = DOT[norm(status)] || 'border border-dashed border-neutral-400 dark:border-neutral-500';
  return `<section class="flex min-w-0 flex-col rounded-lg bg-neutral-50 lg:flex-1 dark:bg-white/5">
    <div class="flex items-center gap-2 px-3 pt-3 pb-2">
      <span class="size-2 shrink-0 rounded-full ${dot}"></span>
      <h2 class="truncate text-sm font-medium">${esc(status || 'Без статусу')}</h2>
      <span class="text-sm tabular-nums text-neutral-500 dark:text-neutral-400">${items.length}</span>
      <span class="ml-auto text-xs tabular-nums text-neutral-500 dark:text-neutral-400">${fmtHours(hours)} год</span>
    </div>
    <div data-list="${esc(status)}" class="flex min-h-20 flex-col gap-2 rounded-lg px-2 pb-2">
      ${items.map((i) => cardHtml(i, cols)).join('') || '<p data-temp class="py-6 text-center text-xs text-neutral-400 dark:text-neutral-500">Порожньо</p>'}
    </div>
    <div class="px-2 pb-2">
      <button type="button" data-add="${esc(status)}" class="w-full rounded-md px-2 py-1.5 text-left text-sm text-neutral-500 hover:bg-neutral-950/5 hover:text-neutral-950 dark:text-neutral-400 dark:hover:bg-white/5 dark:hover:text-white">+ Задача</button>
    </div>
  </section>`;
}

// Колір проєкту — той самий, що в статистиці (рейтинг за годинами за весь період). Поки статистики немає — сірий.
let projectColors = null;
function projectColor(name) {
  if (!projectColors) {
    const stats = state.stats || cacheGet('kanbanStats');
    if (!stats) return null;
    projectColors = new Map(computeStats(stats).projects.filter((p) => !p.other).map((p) => [norm(p.name), p.color]));
  }
  return projectColors.get(norm(name));
}

function chipHtml(name) {
  const color = projectColor(name);
  return color
    ? `<span class="chip inline-flex items-center gap-1 rounded px-1.5 py-0.5 font-medium text-neutral-800 dark:text-neutral-100" style="--c:${color}"><span class="size-1.5 rounded-full" style="background:var(--c)"></span>${esc(name)}</span>`
    : `<span class="rounded bg-neutral-100 px-1.5 py-0.5 font-medium text-neutral-700 dark:bg-white/10 dark:text-neutral-300">${esc(name)}</span>`;
}

function cardHtml(i, cols) {
  const meta = [
    i.project && chipHtml(i.project),
    i.hours != null && `<span class="tabular-nums">${fmtHours(i.hours)} год</span>`,
    i.assignee && `<span>${esc(i.assignee)}</span>`,
    i.doneDate && norm(i.status) === 'done' ? `<span title="Виконано" class="inline-flex items-center gap-0.5">${ICON_CHECK}${esc(i.doneDate)}</span>`
      : i.deadline ? `<span title="Дедлайн">до ${esc(i.deadline)}</span>`
      : i.doneDate && `<span title="Дата">${esc(i.doneDate)}</span>`,
  ].filter(Boolean).join('');
  const links = [[i.briefLink, 'ТЗ', ICON_BRIEF], [i.fileLink, 'Файл', ICON_FILE]]
    .filter(([u]) => safeUrl(u))
    .map(([u, label, icon]) => `<a href="${esc(u)}" target="_blank" rel="noopener" title="${label}" aria-label="${label}" class="rounded p-1 text-neutral-500 hover:bg-neutral-950/5 hover:text-neutral-950 dark:text-neutral-400 dark:hover:bg-white/10 dark:hover:text-white">${icon}</a>`).join('');
  const current = columnFor(cols, i.status);
  const options = cols.map((s) => `<option value="${esc(s)}"${s === current ? ' selected' : ''}>${esc(s || 'Без статусу')}</option>`).join('');
  return `<article ${i.row ? `data-row="${i.row}" tabindex="0"` : 'data-temp'} class="cursor-pointer rounded-md border border-neutral-950/10 bg-white p-3 shadow-xs outline-none hover:border-neutral-950/25 focus-visible:border-neutral-950 dark:border-white/10 dark:bg-neutral-900 dark:hover:border-white/25 dark:focus-visible:border-white ${i.row ? '' : 'opacity-60'}">
    <p class="text-sm leading-snug font-medium break-words">${esc(i.title)}</p>
    ${meta ? `<div class="mt-2 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-neutral-500 dark:text-neutral-400">${meta}</div>` : ''}
    <div class="mt-2 flex items-center justify-between gap-2">
      <select data-status-select aria-label="Статус" ${i.row ? '' : 'disabled'} class="h-7 min-w-0 rounded border border-transparent bg-transparent px-1 text-xs text-neutral-500 hover:border-neutral-950/15 dark:text-neutral-400 dark:hover:border-white/15">${options}</select>
      ${links ? `<span class="flex shrink-0 gap-0.5">${links}</span>` : ''}
    </div>
  </article>`;
}

const findItem = (row) => state.data?.items.find((i) => String(i.row) === String(row));

// ---------- зміни ----------
async function save(item, patch) {
  const tab = state.tab, before = { ...item };
  state.loadSeq++; // відповідь завантаження, що вже летить, застаріла — не перезаписуємо нею зміну
  Object.assign(item, patch);
  render();
  state.pending++;
  try {
    const res = await api(null, { action: 'update', tab, row: item.row, expectedTitle: before.title, patch });
    Object.assign(item, res.item);
    state.statsStale = true; // статистика перерахується при наступному відкритті
  } catch (e) {
    Object.assign(item, before);
    toast(e.message);
    if (e.code === 'conflict') await loadList({ silent: true, fresh: true });
  } finally {
    state.pending--;
    if (tab === state.tab) render();
  }
}

// Переставляє картку в колонці: рядок у таблиці переїжджає перед before (або після after).
async function move(item, before, after) {
  if (!before && !after) return;
  const tab = state.tab, items = state.data.items;
  items.splice(items.indexOf(item), 1);
  items.splice(before ? items.indexOf(before) : items.indexOf(after) + 1, 0, item);
  render();
  state.pending++;
  state.loadSeq++;
  try {
    await api(null, {
      action: 'move', tab, row: item.row, expectedTitle: item.title,
      ...(before ? { before: before.row, beforeTitle: before.title } : { after: after.row, afterTitle: after.title }),
    });
    state.statsStale = true;
  } catch (e) {
    toast(e.message);
  } finally {
    state.pending--;
    if (tab === state.tab) await loadList({ silent: true, fresh: true }); // номери рядків змінились
  }
}

async function create(status, title) {
  const tab = state.tab;
  state.loadSeq++;
  const temp = { row: 0, title, status, project: state.project, hours: null, assignee: '', deadline: '', doneDate: '' };
  state.data.items.push(temp);
  render();
  state.pending++;
  try {
    const res = await api(null, { action: 'create', tab, item: { title, status, project: state.project || undefined } });
    Object.assign(temp, res.item);
    state.statsStale = true;
  } catch (e) {
    state.data.items.splice(state.data.items.indexOf(temp), 1);
    toast(e.message);
  } finally {
    state.pending--;
    if (tab === state.tab) render();
  }
}

$('#board').addEventListener('change', (e) => {
  if (!e.target.matches('[data-status-select]')) return;
  const item = findItem(e.target.closest('[data-row]').dataset.row);
  if (item) save(item, { status: e.target.value });
});

$('#board').addEventListener('click', (e) => {
  const add = e.target.closest('[data-add]');
  if (add) return openAddForm(add);
  if (e.target.closest('select, a') || Date.now() - state.lastDrag < 300) return;
  const card = e.target.closest('[data-row]');
  if (card) openEdit(findItem(card.dataset.row));
});

$('#board').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('[data-row]')) openEdit(findItem(e.target.dataset.row));
});

function openAddForm(btn) {
  const status = btn.dataset.add;
  const form = document.createElement('form');
  form.dataset.addForm = '';
  form.innerHTML = `<input name="title" required placeholder="Назва задачі" aria-label="Назва нової задачі" class="block w-full rounded-md border border-neutral-950/15 bg-white px-3 py-2 text-sm outline-none focus:border-neutral-950 dark:border-white/15 dark:bg-neutral-900 dark:focus:border-white">`;
  btn.replaceWith(form);
  const input = form.elements.title;
  input.focus();
  const close = () => { if (form.isConnected) form.replaceWith(btn); };
  input.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  input.addEventListener('blur', () => { if (!input.value.trim()) close(); });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = input.value.trim();
    if (!title) return;
    form.remove();
    create(status, title);
  });
}

// ---------- редагування ----------
const dialog = $('#editDialog'), editForm = $('#editForm');
let editing = null;

function openEdit(item) {
  if (!item) return;
  editing = item;
  const f = editForm.elements;
  f.title.value = item.title;
  f.hours.value = item.hours == null ? '' : fmtHours(item.hours);
  f.project.value = item.project;
  f.assignee.value = item.assignee;
  f.comment.value = item.comment;
  [f.deadline.value, f.deadlineTime.value = ''] = (item.deadlineIso || '').split('T');
  f.deadlineTime.disabled = !f.deadline.value;
  const cols = state.data.columns;
  for (const name of ['hours', 'project', 'assignee', 'comment', 'deadline']) f[name].closest('label, [role=group]').hidden = !cols.includes(name);
  $('#editError').textContent = '';
  dialog.showModal();
}

editForm.addEventListener('submit', (e) => {
  if (e.submitter?.value !== 'save' || !editing) return;
  const f = editForm.elements, patch = {};
  const hoursText = f.hours.value.trim().replace(/\s/g, '').replace(',', '.');
  const hours = hoursText === '' ? null : Number(hoursText);
  if (Number.isNaN(hours)) { e.preventDefault(); $('#editError').textContent = MESSAGES.bad_hours; return; }
  const next = { title: f.title.value.trim(), hours, project: f.project.value.trim(), assignee: f.assignee.value.trim(), comment: f.comment.value.trim(),
    deadline: f.deadline.value && f.deadlineTime.value ? `${f.deadline.value}T${f.deadlineTime.value}` : f.deadline.value };
  if (!next.title) { e.preventDefault(); $('#editError').textContent = MESSAGES.title_required; return; }
  const cur = { ...editing, deadline: editing.deadlineIso || '' };
  for (const k of Object.keys(next)) {
    if (k !== 'title' && !state.data.columns.includes(k)) continue;
    if ((next[k] ?? '') !== (cur[k] ?? '')) patch[k] = next[k];
  }
  if (Object.keys(patch).length) save(editing, patch);
});
dialog.addEventListener('close', () => { editing = null; });
editForm.elements.deadline.addEventListener('input', (e) => {
  editForm.elements.deadlineTime.disabled = !e.target.value;
  if (!e.target.value) editForm.elements.deadlineTime.value = '';
});

// ---------- вид: дошка / статистика ----------
function setView(view) {
  state.view = view === 'stats' ? 'stats' : 'board';
  store.set('kanbanView', state.view);
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === state.view));
  $('#board').hidden = $('#boardControls').hidden = state.view !== 'board';
  $('#stats').hidden = state.view !== 'stats';
  if (state.view !== 'stats') return;
  if (state.stats) renderStats();
  if (!state.stats || state.statsStale) loadStats();
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

// ---------- статистика ----------
const NORM = 160; // норма годин на місяць — понад неї рахується овертайм
const OVERTIME_ROW = /^overtime/i; // рядок-оцінка овертайму — не робота, не рахуємо
const CARRYOVER_ROW = /^години за/i; // перенесені години: входять у суму місяця, але не в проєкти/типи/задачі
const CATEGORIES = [ // перша збіжна категорія виграє; решта — «Інше»
  ['Презентації', /презен|проезентац|pitch|deck|дека|слайд|пропозал|proposal|outlook/i],
  ['Айдентика, стиль, дизайн-системи', /айдентик|ідентик|ідентичн|стил|логотип|логобук|бренд|систем|гайдлайн|шаблон|візит|мерч|пакуванн|подарунк/i],
  ['Сайти й посадкові', /сайт|лендінг|landing|посадков|портал/i],
  ['Публікації й соцмережі', /публіка|пост|допис|соцмереж|соціальн|інстаграм|instagram|linkedin|сторіс|карусел|банер|reels/i],
  ['Документи, звіти, one-pager’и', /звіт|report|документ|one.?pager|резюме|брошур|бланк|сертифікат|лист|framework|схем|а3|a3|дашборд|органігр|інвойс|каталог|catalog|огляд|аналіз/i],
];
const SERIES = 7; // перші 7 проєктів — власний колір, решта — «Інше»
const EN_MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const UA_MONTHS = ['Січ', 'Лют', 'Бер', 'Кві', 'Тра', 'Чер', 'Лип', 'Сер', 'Вер', 'Жов', 'Лис', 'Гру'];
const sumHours = (items) => items.reduce((s, i) => s + (i.hours || 0), 0);
const pct = (a, b) => `${b ? Math.round((a / b) * 100) : 0}%`;

function monthLabel(tab) {
  const m = tab.trim().match(/^([a-z]+)\s+(\d{2}|\d{4})$/i);
  const i = m ? EN_MONTHS.indexOf(m[1].slice(0, 3).toLowerCase()) : -1;
  return i < 0 ? tab : `${UA_MONTHS[i]} ${m[2].slice(-2)}`;
}

async function loadStats({ fresh = false, background = false } = {}) {
  const box = $('#stats'), btn = $('#refreshBtn');
  const msg = (text) => { box.innerHTML = `<p class="py-16 text-center text-sm text-neutral-500 dark:text-neutral-400">${esc(text)}</p>`; };
  if (!state.stats) state.stats = cacheGet('kanbanStats');
  const visible = () => state.view === 'stats';
  if (visible()) { if (state.stats) renderStats(); else msg('Завантаження всіх місяців…'); }
  if (!background) btn.disabled = true;
  try {
    state.stats = (await api({ action: 'all', ...(fresh && { fresh: 1 }) })).tabs;
    state.statsStale = false;
    cacheSet('kanbanStats', state.stats);
    projectColors = null;
    if (visible()) renderStats();
    else if (state.data && !state.dragging && !state.pending && !document.querySelector('[data-add-form]')) render(); // кольори чіпів
  } catch (e) {
    if (e.code === 'unauthorized' || !visible()) return;
    if (state.stats) toast(e.message); else msg(e.message);
  } finally {
    if (!background) btn.disabled = false;
  }
}

function computeStats(tabs) {
  // Вкладки йдуть від новішої до старішої — для графіків розвертаємо.
  const months = tabs.slice().reverse().map((t) => {
    const items = t.items.filter((i) => !OVERTIME_ROW.test(i.title));
    return { label: monthLabel(t.tab), hours: sumHours(items), work: items.filter((i) => !CARRYOVER_ROW.test(i.title)) };
  });
  const byProject = new Map();
  months.forEach((m, mi) => m.work.forEach((i) => {
    const k = norm(i.project);
    if (!byProject.has(k)) byProject.set(k, { name: i.project.trim() || 'Без проєкту', total: 0, months: months.map(() => 0) });
    const p = byProject.get(k);
    p.total += i.hours || 0;
    p.months[mi] += i.hours || 0;
  }));
  let projects = [...byProject.values()].filter((p) => p.total > 0).sort((a, b) => b.total - a.total);
  if (projects.length > SERIES) {
    const rest = projects.slice(SERIES);
    projects = projects.slice(0, SERIES).concat({ name: 'Інше', other: true, total: sumHours(rest.map((p) => ({ hours: p.total }))), months: months.map((_, mi) => rest.reduce((s, p) => s + p.months[mi], 0)) });
  }
  projects.forEach((p, i) => { p.color = p.other ? 'var(--series-other)' : `var(--series-${i + 1})`; });

  const work = months.flatMap((m) => m.work.map((i) => ({ ...i, month: m.label })));
  const cats = CATEGORIES.map(([name]) => ({ name, total: 0 })).concat({ name: 'Інше', total: 0 });
  work.forEach((i) => {
    const k = CATEGORIES.findIndex(([, re]) => re.test(i.title));
    cats[k < 0 ? cats.length - 1 : k].total += i.hours || 0;
  });

  const hours = months.map((m) => m.hours), sorted = hours.slice().sort((a, b) => a - b), n = hours.length;
  return {
    months, projects, work,
    cats: cats.filter((c) => c.total > 0).sort((a, b) => (a.name === 'Інше') - (b.name === 'Інше') || b.total - a.total),
    top: work.slice().sort((a, b) => (b.hours || 0) - (a.hours || 0)).slice(0, 10),
    total: sumHours(months),
    avg: n ? sumHours(months) / n : 0,
    median: n ? (n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2) : 0,
    last6: sumHours(months.slice(-6)) / Math.min(6, n || 1),
    done: work.filter((i) => norm(i.status) === 'done').length,
    projectCount: [...byProject.keys()].filter(Boolean).length,
    over: months.filter((m) => m.hours > NORM),
  };
}

function renderStats() {
  const s = computeStats(state.stats);
  if (!s.months.length) return void ($('#stats').innerHTML = '<p class="py-16 text-center text-sm text-neutral-500">Немає даних.</p>');
  const card = 'rounded-lg border border-neutral-950/10 p-4 dark:border-white/10';
  const muted = 'text-neutral-500 dark:text-neutral-400';
  const section = (title, sub, body) => `<section><h2 class="text-base font-semibold">${title}</h2>${sub ? `<p class="mt-0.5 text-sm ${muted}">${sub}</p>` : ''}<div class="mt-4">${body}</div></section>`;
  const tile = (label, value, note = '') => `<div class="${card}"><p class="text-xs ${muted}">${label}</p><p class="mt-1 text-2xl font-semibold tabular-nums">${value}</p>${note ? `<p class="mt-0.5 text-xs ${muted}">${note}</p>` : ''}</div>`;
  const h = (n) => `${fmtHours(n)} год`;

  // Години по місяцях: стовпчики + лінії середнього і норми
  const max1 = Math.max(NORM, ...s.months.map((m) => m.hours)) * 1.08;
  const y1 = (v) => `${((v / max1) * 100).toFixed(2)}%`;
  const refLine = (v, label, style) => `<div class="pointer-events-none absolute inset-x-0 border-t ${style}" style="bottom:${y1(v)}"><span class="absolute right-0 -translate-y-full bg-white/80 px-1 text-[11px] ${muted} dark:bg-neutral-950/80">${label}</span></div>`;
  const labels = `<div class="flex gap-1.5 pt-1.5">${s.months.map((m) => `<span class="flex-1 text-center text-[11px] ${muted}">${esc(m.label)}</span>`).join('')}</div>`;
  const monthsChart = `<div class="overflow-x-auto"><div class="min-w-[36rem]">
    <div class="relative flex h-56 items-end gap-1.5 border-b border-neutral-950/15 dark:border-white/15">
      ${s.months.map((m) => `<div class="flex h-full flex-1 items-end" data-tip="${esc(m.label)}: ${h(m.hours)}${m.hours > NORM ? `, понад норму на ${fmtHours(m.hours - NORM)}` : ''}">
        <div class="w-full rounded-t-[4px]" style="height:${y1(m.hours)};background:var(${m.hours > NORM ? '--viz-bar-over' : '--viz-bar'})"></div></div>`).join('')}
      ${refLine(NORM, `норма ${NORM}`, 'border-dotted border-neutral-950/50 dark:border-white/50')}
      ${refLine(s.avg, `середнє ${fmtHours(Math.round(s.avg))}`, 'border-dashed border-neutral-950/30 dark:border-white/30')}
    </div>${labels}</div></div>
    <p class="mt-2 flex items-center gap-2 text-xs ${muted}"><span class="size-2.5 rounded-sm" style="background:var(--viz-bar-over)"></span>місяці понад норму</p>`;

  // Проєкти по місяцях: складені стовпчики
  const max2 = Math.max(...s.months.map((_, mi) => s.projects.reduce((t, p) => t + p.months[mi], 0)), 1) * 1.05;
  const legend = `<div class="mb-3 flex flex-wrap gap-x-4 gap-y-1 text-xs">${s.projects.map((p) => `<span class="flex items-center gap-1.5"><span class="size-2.5 rounded-sm" style="background:${p.color}"></span>${esc(p.name)}</span>`).join('')}</div>`;
  const stacked = `${legend}<div class="overflow-x-auto"><div class="min-w-[36rem]">
    <div class="flex h-56 items-end gap-1.5 border-b border-neutral-950/15 dark:border-white/15">
      ${s.months.map((m, mi) => {
        const segs = s.projects.filter((p) => p.months[mi] > 0);
        return `<div class="flex h-full flex-1 flex-col-reverse gap-[2px]">${segs.map((p, si) => `<div data-tip="${esc(m.label)}, ${esc(p.name)}: ${h(p.months[mi])}" class="w-full ${si === segs.length - 1 ? 'rounded-t-[4px]' : ''}" style="height:${((p.months[mi] / max2) * 100).toFixed(2)}%;background:${p.color}"></div>`).join('')}</div>`;
      }).join('')}
    </div>${labels}</div></div>`;

  // Горизонтальні смуги (проєкти, типи робіт)
  const barList = (rows, total) => {
    const max = Math.max(...rows.map((r) => r.total), 1);
    return `<div class="space-y-2.5">${rows.map((r) => `<div class="grid grid-cols-[1fr_auto] items-center gap-x-3 gap-y-1 text-sm sm:grid-cols-[minmax(0,11rem)_1fr_7.5rem]" data-tip="${esc(r.name)}: ${h(r.total)} (${pct(r.total, total)})">
      <span class="truncate">${esc(r.name)}</span>
      <div class="order-last col-span-2 h-2.5 sm:order-none sm:col-span-1"><div class="h-full rounded-r-[4px]" style="width:${((r.total / max) * 100).toFixed(2)}%;background:${r.color || 'var(--viz-cat)'}"></div></div>
      <span class="flex justify-end gap-3 tabular-nums ${muted}"><span>${fmtHours(Math.round(r.total * 10) / 10)}</span><span class="w-9 text-right">${pct(r.total, total)}</span></span></div>`).join('')}</div>`;
  };
  const projSum = sumHours(s.projects.map((p) => ({ hours: p.total })));
  const catSum = sumHours(s.cats.map((c) => ({ hours: c.total })));

  const top = `<div class="overflow-x-auto"><table class="w-full text-left text-sm">
    <thead class="text-xs ${muted}"><tr class="border-b border-neutral-950/10 dark:border-white/10"><th class="py-2 pr-3 font-medium">Місяць</th><th class="py-2 pr-3 font-medium">Задача</th><th class="py-2 pr-3 font-medium">Проєкт</th><th class="py-2 text-right font-medium">Годин</th></tr></thead>
    <tbody>${s.top.map((i) => `<tr class="border-b border-neutral-950/5 dark:border-white/5"><td class="py-2 pr-3 whitespace-nowrap ${muted}">${esc(i.month)}</td><td class="py-2 pr-3">${esc(i.title)}</td><td class="py-2 pr-3 whitespace-nowrap ${muted}">${esc(i.project)}</td><td class="py-2 text-right tabular-nums">${fmtHours(i.hours)}</td></tr>`).join('')}</tbody></table></div>`;

  const monthTable = `<details class="mt-3 text-sm"><summary class="cursor-pointer ${muted}">Таблиця по місяцях</summary>
    <table class="mt-2 w-full max-w-xs text-sm"><tbody>${s.months.map((m) => `<tr class="border-b border-neutral-950/5 dark:border-white/5"><td class="py-1 ${muted}">${esc(m.label)}</td><td class="py-1 text-right tabular-nums">${fmtHours(m.hours)}</td></tr>`).join('')}</tbody></table></details>`;

  $('#stats').innerHTML = `
    <div><h2 class="text-xl font-semibold">${esc(s.months[0].label)} — ${esc(s.months.at(-1).label)}</h2>
      <p class="mt-1 text-sm ${muted}">Норма ${NORM} год на місяць</p></div>
    <div class="grid grid-cols-2 gap-3 md:grid-cols-4">
      ${tile('Всього годин', fmtHours(Math.round(s.total * 10) / 10))}
      ${tile('Середнє на місяць', fmtHours(Math.round(s.avg * 10) / 10), `медіана ${fmtHours(s.median)}`)}
      ${tile('Середнє за 6 міс.', fmtHours(Math.round(s.last6 * 10) / 10))}
      ${tile('Задач виконано', s.done, `проєктів: ${s.projectCount}`)}
    </div>
    ${s.over.length ? `<p class="-mt-6 text-sm ${muted}">Понад норму: ${s.over.map((m) => `${esc(m.label)} (+${fmtHours(m.hours - NORM)})`).join(', ')}</p>` : ''}
    ${section('Години по місяцях', '', monthsChart + monthTable)}
    ${section('Проєкти по місяцях', '', stacked)}
    ${section('Розподіл по проєктах', `${h(Math.round(projSum * 10) / 10)} у задачах`, barList(s.projects, projSum))}
    ${section('Типи робіт', 'За ключовими словами в назві задачі', barList(s.cats, catSum))}
    ${section('Найбільші задачі', '', top)}`;
}

const tip = $('#tip');
function showTip(e) {
  const t = e.target.closest?.('[data-tip]');
  if (!t) return void (tip.hidden = true);
  tip.textContent = t.dataset.tip;
  tip.hidden = false;
  tip.style.left = `${Math.max(8, Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8))}px`;
  tip.style.top = `${Math.max(8, e.clientY - tip.offsetHeight - 12)}px`;
}
$('#stats').addEventListener('pointermove', showTip);
$('#stats').addEventListener('pointerdown', showTip);
$('#stats').addEventListener('pointerleave', () => { tip.hidden = true; });

// ---------- старт ----------
const hashKey = new URLSearchParams(location.hash.slice(1)).get('key');
if (hashKey) {
  store.set('kanbanKey', hashKey);
  history.replaceState(null, '', location.pathname + location.search);
}
key = hashKey || store.get('kanbanKey') || '';
if (key) start(); else logout();
</script>
</body>
